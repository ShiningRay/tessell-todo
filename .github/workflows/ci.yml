name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libfreetype6-dev libharfbuzz-dev libgl1-mesa-dev
      - name: Install shards
        run: shards install
      - name: Run specs
        run: crystal spec
